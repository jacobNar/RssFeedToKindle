<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS to Kindle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>RSS to Kindle</h1>
            <button id="download-btn" class="primary-btn" disabled>Send to Kindle</button>
        </div>
    </header>

    <main>
        <div class="controls-bar">
            <input type="text" id="search-input" placeholder="Search articles...">
            <select id="feed-filter">
                <option value="">All Publications</option>
            </select>
        </div>

        <div class="url-bar">
            <input type="url" id="custom-url-input" placeholder="Enter article URL (e.g. https://example.com/article)..." required>
            <button id="send-url-btn" class="primary-btn">Send Link</button>
        </div>

        <div id="loading" class="loading">Loading feeds...</div>
        <div id="error" class="error hidden"></div>
        <div id="articles-grid" class="articles-grid"></div>

        <div id="pagination" class="pagination hidden">
            <button id="prev-btn" class="secondary-btn" disabled>Previous</button>
            <span id="page-info">Page 1 of 1</span>
            <button id="next-btn" class="secondary-btn" disabled>Next</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
